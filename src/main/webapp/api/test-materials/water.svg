<svg xmlns="http://www.w3.org/2000/svg" width="120" height="100" viewBox="0 0 120 100">
  <!-- 水分子 H2O -->
  <!-- 氧原子 -->
  <circle cx="60" cy="50" r="20" fill="#E94B3C" stroke="#000000" stroke-width="2"/>
  <text x="60" y="56" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="white">O</text>
  
  <!-- 氢原子 1 -->
  <circle cx="30" cy="30" r="12" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
  <text x="30" y="36" font-family="Arial" font-size="10" font-weight="bold" text-anchor="middle" fill="black">H</text>
  
  <!-- 氢原子 2 -->
  <circle cx="90" cy="30" r="12" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
  <text x="90" y="36" font-family="Arial" font-size="10" font-weight="bold" text-anchor="middle" fill="black">H</text>
  
  <!-- 化学键 -->
  <line x1="40" y1="40" x2="48" y2="38" stroke="#000000" stroke-width="3"/>
  <line x1="80" y1="40" x2="72" y2="38" stroke="#000000" stroke-width="3"/>
  
  <!-- 标签 -->
  <text x="60" y="90" font-family="Arial" font-size="12" text-anchor="middle" fill="black">H₂O</text>
</svg>

